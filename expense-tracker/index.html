<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saveit</title>
  <meta name="description" content="Saveit: a fast, private expense tracker for your phone. Log spending in seconds, set budgets, and see where your money goes. Works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f3f5">

  <!-- Installed app (home screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Saveit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <main>
      <section class="screen" id="screen-home" aria-labelledby="home-title" hidden>
        <header class="topbar"><div class="topbar-inner"><span class="topbar-title" aria-hidden="true">Overview</span></div></header>
        <h1 class="large-title" id="home-title">Overview</h1>
        <div class="screen-content"></div>
      </section>

      <section class="screen" id="screen-activity" aria-labelledby="activity-title" hidden>
        <header class="topbar"><div class="topbar-inner"><span class="topbar-title" aria-hidden="true">Activity</span></div></header>
        <h1 class="large-title" id="activity-title">Activity</h1>
        <div class="screen-content"></div>
      </section>

      <section class="screen" id="screen-budgets" aria-labelledby="budgets-title" hidden>
        <header class="topbar"><div class="topbar-inner"><span class="topbar-title" aria-hidden="true">Budgets</span></div></header>
        <h1 class="large-title" id="budgets-title">Budgets</h1>
        <div class="screen-content"></div>
      </section>

      <section class="screen" id="screen-settings" aria-labelledby="settings-title" hidden>
        <header class="topbar"><div class="topbar-inner"><span class="topbar-title" aria-hidden="true">Settings</span></div></header>
        <h1 class="large-title" id="settings-title">Settings</h1>
        <div class="screen-content"></div>
      </section>
    </main>

    <button type="button" class="fab" aria-label="Add transaction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="#/home" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        Home
      </a>
      <a class="tab" href="#/activity" data-tab="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        Activity
      </a>
      <a class="tab" href="#/budgets" data-tab="budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>
        Budgets
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;text-align:center">Saveit needs JavaScript to run.</p>
  </noscript>
</body>
</html>
